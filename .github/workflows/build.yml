name: Build

on:
  push:
    tags:
      - "**"
    paths-ignore:
      - "ui/**"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: wkspower

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sudo echo "ALEPH_SECRET=batman\n" >> aleph.env

      - name: Extract tag or fallback
        id: extract_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME=$(git describe --tags --exact-match 2>/dev/null || echo "latest")
          fi
          echo "TAG=$TAG_NAME" >> "$GITHUB_ENV"
          echo "::set-output name=tag::$TAG_NAME"

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build, tag and push latest image
        uses: docker/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: |
            "ghcr.io/wkspower/aleph:${{ steps.extract_tag.outputs.tag }}"
            "ghcr.io/wkspower/aleph:latest"